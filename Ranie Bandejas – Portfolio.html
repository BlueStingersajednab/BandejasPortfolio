<style>
:root{--bg:#060A13;--panel:rgba(18,28,46,.62);--line:rgba(34,228,255,.28);--cy:#22E4FF;--ye:#FFE23A;--tx:#D7E4F2;--mu:#8497AD;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:90px;height:100%}
body{margin:0;background:radial-gradient(900px 500px at 80% -5%,rgba(34,228,255,.12),transparent),radial-gradient(700px 500px at 0% 40%,rgba(255,226,58,.05),transparent),var(--bg);color:var(--tx);font-family:Outfit,system-ui,sans-serif}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:60;background:repeating-linear-gradient(0deg,rgba(255,255,255,.028) 0 1px,transparent 1px 3px)}
h1,h2,h3,.hd{font-family:'Chakra Petch',system-ui,sans-serif}
.glass{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 0 28px rgba(34,228,255,.07),inset 0 1px 0 rgba(255,255,255,.06)}
.hex{clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.glow{text-shadow:0 0 14px rgba(34,228,255,.6)}
.btn{font-family:'Chakra Petch';font-weight:600;padding:.7rem 1.2rem;border:1px solid var(--cy);color:var(--cy);background:rgba(34,228,255,.08);transition:.2s;cursor:pointer;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.btn:hover{background:var(--cy);color:#041018;box-shadow:0 0 22px var(--cy)}
.btn.y{border-color:var(--ye);color:var(--ye);background:rgba(255,226,58,.08)}
.btn.y:hover{background:var(--ye);color:#1a1500;box-shadow:0 0 22px var(--ye)}
.fld{width:100%;background:rgba(4,10,20,.7);border:1px solid var(--line);color:var(--tx);padding:.75rem .9rem;outline:none;transition:.2s;font:inherit}
.fld:focus{border-color:var(--cy);box-shadow:0 0 0 1px var(--cy),0 0 20px rgba(34,228,255,.3)}
:focus-visible{outline:2px solid var(--ye);outline-offset:2px}
.slot{transition:.2s;cursor:pointer;text-align:left}
.slot:hover,.slot[aria-pressed=true]{border-color:var(--ye);box-shadow:0 0 24px rgba(255,226,58,.25)}
.badge{transition:transform .15s ease-out,filter .2s;transform:perspective(600px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));cursor:pointer;background:none;border:0;padding:0}
.badge:hover,.badge:focus-visible{filter:drop-shadow(0 0 16px var(--cy)) drop-shadow(0 0 4px var(--cy))}
.bar{height:8px;background:rgba(255,255,255,.07)}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--ye));box-shadow:0 0 10px var(--cy);transition:width .5s}
@keyframes scan{0%{top:0}100%{top:100%}}
.scan::after{content:"";position:absolute;left:0;right:0;height:2px;background:var(--cy);box-shadow:0 0 12px var(--cy);animation:scan 3.2s linear infinite}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.pop{animation:pop .22s ease-out}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function Tilt({children,onClick,label}){const [t,setT]=useState({});
 const mv=e=>{const r=e.currentTarget.getBoundingClientRect();setT({"--rx":((e.clientY-r.top)/r.height-.5)*-22+"deg","--ry":((e.clientX-r.left)/r.width-.5)*22+"deg"})};
 return html`<button class="badge" style=${t} onMouseMove=${mv} onMouseLeave=${()=>setT({})} onClick=${onClick} aria-label=${label}>${children}</button>`}

 return html`<section id="badges" class="max-w-6xl mx-auto px-4 py-12"><h2 class="hd font-bold text-3xl glow">Certificates</h2><p class="mt-1" style=${{color:"var(--mu)"}}>Nine certificates. Select one to inspect it.</p>

function Comms(){const [f,setF]=useState({n:"",e:"",m:""});const [ok,setOk]=useState(false);const [cp,setCp]=useState(false);
 const copy=()=>{const t=document.createElement("textarea");t.value=EMAIL;document.body.appendChild(t);t.select();let k=false;try{k=document.execCommand("copy")}catch(e){}t.remove();if(!k&&navigator.clipboard)navigator.clipboard.writeText(EMAIL).catch(()=>{});setCp(true);setTimeout(()=>setCp(false),1800)};
 const set=k=>e=>setF({...f,[k]:e.target.value});
 const send=e=>{e.preventDefault();window.open(GM("Portfolio message from "+f.n,f.m+"\n\n"+f.n+" ("+f.e+")"),"_blank");const _x=`${""}${encodeURIComponent("Portfolio message from "+f.n)}&body=${encodeURIComponent(f.m+"\n\n"+f.n+" ("+f.e+")")}`;setOk(true)};
 const ic=(l,h,d)=>html`<a href=${h} aria-label=${l} title=${l} class="btn !p-3 flex items-center justify-center gap-2" ...${h==="#"?{onClick:e=>e.preventDefault()}:{target:"_blank",rel:"noopener"}}><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d=${d}/></svg></a>`;
 return html`<section id="comms" class="max-w-6xl mx-auto px-4 py-12 pb-24"><h2 class="hd font-bold text-3xl glow">Communication link</h2><p class="mt-1" style=${{color:"var(--mu)"}}>Open a channel. Your message goes to my email.</p>

 <div><button class="btn" type="submit">Send transmission</button>${ok&&html`<p class="mt-3 text-sm" style=${{color:"var(--ye)"}}>Gmail opened in a new tab with your message ready. Press send there to finish.</p>`}</div></form>

  <p class="text-sm flex flex-wrap items-center gap-2"><a href=${GM()} target="_blank" rel="noopener" class="underline break-all select-text" style=${{color:"var(--cy)"}}>${EMAIL}</a><button type="button" class="btn !py-1 !px-3 text-xs" onClick=${copy}>${cp?"Copied":"Copy"}</button></p><p class="text-sm" style=${{color:"var(--mu)"}}>Brgy. Gabu-an, Roxas City, Capiz</p></div></div></section>`}
